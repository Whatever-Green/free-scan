<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freescan</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js" defer></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
  </script>
  <style>
    body {
      font-family: 'Lexend Deca', sans-serif;
    }

    /* Small metallic sheen in the bottom corner */
    .exam-sheen {
      position: fixed;
      right: -120px;
      bottom: -120px;
      width: 260px;
      height: 260px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      background:
        linear-gradient(
          120deg,
          transparent 20%,
          rgba(255, 255, 255, 0.15) 35%,
          rgba(255, 255, 255, 0.75) 50%,
          rgba(255, 255, 255, 0.15) 65%,
          transparent 80%
        ),
        radial-gradient(
          circle,
          rgba(192, 192, 192, 0.35),
          rgba(120, 120, 120, 0.12),
          transparent 70%
        );
      background-size: 220% 220%, 100% 100%;
      animation: sheenEnter 5.5s ease-in-out infinite;
    }

    @keyframes sheenEnter {
      0% {
        opacity: 0;
        transform: translate(60px, 60px) scale(0.85) rotate(0deg);
        background-position: -120% -120%, center;
      }

      18% {
        opacity: 0.7;
        transform: translate(0, 0) scale(1) rotate(8deg);
      }

      45% {
        opacity: 0.9;
        background-position: 120% 120%, center;
      }

      70% {
        opacity: 0.35;
        transform: translate(10px, 10px) scale(1.05) rotate(14deg);
      }

      100% {
        opacity: 0;
        transform: translate(80px, 80px) scale(0.9) rotate(20deg);
        background-position: 220% 220%, center;
      }
    }
  </style>
</head>

<body class="opacity-0 transition-opacity duration-700 bg-white text-black dark:bg-black dark:text-white min-h-screen flex flex-col items-center justify-center">

  <!-- Dark Mode Toggle Button -->
  <button id="darkToggle" class="absolute top-4 right-4 text-2xl hover:opacity-80 transition-transform duration-300 hover:rotate-12 active:scale-90 z-20">
   🌙
  </button>

  <!-- Subtle Exam Season Metallic Sheen -->
  <div class="exam-sheen"></div>

  <!-- Hero Section with Animation -->
  <div id="hero" class="relative z-10 text-center opacity-0 translate-y-4 transition-all duration-700">
    <h1 class="text-5xl font-bold mb-2">
      Freescan <small class="text-base opacity-70">BETA</small>
    </h1>

    <p class="text-lg mb-2">Free hosting for Textbooks and Resources</p>

    <div class="mb-6 inline-flex items-center gap-2 px-4 py-2 rounded-full border border-black/20 dark:border-white/30 bg-yellow-100 dark:bg-yellow-900/40 text-sm">
      👋 Welcome back!
    </div>

    <div class="flex flex-col items-center space-y-4">
      <a href="GCSE.html" class="px-6 py-3 border border-black dark:border-white rounded-lg shadow hover:bg-gray-100 dark:hover:bg-gray-800 transition transform hover:scale-105 active:scale-95">
        GCSE
      </a>
      <a href="A-Level.html" class="px-6 py-3 border border-black dark:border-white rounded-lg shadow hover:bg-gray-100 dark:hover:bg-gray-800 transition transform hover:scale-105 active:scale-95">
        A-Level
      </a>
      <a href="University.html" class="px-6 py-3 border border-black dark:border-white rounded-lg shadow hover:bg-gray-100 dark:hover:bg-gray-800 transition transform hover:scale-105 active:scale-95">
        University
      </a>
    </div>
  </div>

  <!-- Footer Links -->
  <div class="absolute top-4 left-4 text-sm z-10">
    <a href="changelog.html"><p>New Textbooks - Click here to find out more</p></a>
  </div>

  <div class="absolute bottom-4 left-4 text-sm z-10">
    <a href="info.html" class="hover:underline">About</a>
  </div>

  <div class="absolute bottom-4 right-4 text-sm z-10">
    <a href="changelog.html" class="hover:underline">0.0.4</a>
  </div>

  <!-- Page Fade-in + Hero Animation Script -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.body.classList.remove('opacity-0');

      const hero = document.getElementById('hero');
      requestAnimationFrame(() => {
        hero.classList.remove('opacity-0', 'translate-y-4');
      });
    });
  </script>


</body>
</html>
